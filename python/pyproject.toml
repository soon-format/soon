[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soon-format"
version = "0.1.0"
description = "SOON (Shape-Oriented Object Notation): lossless, token-efficient encoding of nested JSON for LLM prompts"
readme = "README.md"
license = "MIT"
authors = [{ name = "Yasin Ughur", email = "yasinugur.cs@gmail.com" }]
requires-python = ">=3.10"
keywords = ["llm", "json", "tokens", "compression", "prompt", "soon", "toon"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/soon-format/soon"
Repository = "https://github.com/soon-format/soon"
Issues = "https://github.com/soon-format/soon/issues"

[project.optional-dependencies]
tokens = ["tiktoken>=0.5"]
dev = ["pytest>=7", "hypothesis>=6", "mypy>=1.8", "ruff>=0.4", "tiktoken>=0.5"]

[project.scripts]
soon = "soon_format.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/soon_format"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "tiktoken"
ignore_missing_imports = true
