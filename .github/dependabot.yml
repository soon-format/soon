version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(ts)
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: pip
    directory: "/python"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(python)
    groups:
      dev-dependencies:
        dependency-type: development
