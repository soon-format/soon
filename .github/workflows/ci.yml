name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  conformance-lint:
    name: Validate conformance fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check fixture JSON validity
        run: python3 -c "
          import json, sys
          from pathlib import Path
          errors = 0
          for f in Path('conformance').rglob('*.json'):
              try:
                  json.loads(f.read_text())
              except json.JSONDecodeError as e:
                  print(f'INVALID {f}: {e}')
                  errors += 1
          print(f'{errors} errors' if errors else 'All fixtures valid')
          sys.exit(1 if errors else 0)
          "
      - name: Conformance coverage report
        run: python3 tests/conformance-coverage.py
